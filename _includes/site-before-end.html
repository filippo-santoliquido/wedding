<!-- Countdown al matrimonio -->
<script>
  (function () {
    var el = document.getElementById('countdown');
    if (!el) return;
    // Safari/iOS richiede il formato ISO completo: lo normalizziamo
    var target = new Date("{{ site.wedding_date }}".replace(' ', 'T')).getTime();
    if (isNaN(target)) { el.textContent = ''; return; }
    var L = { g: 'giorni', o: 'ore', m: 'min', s: 'sec' };
    function pad(n){ return (n < 10 ? '0' : '') + n; }
    function tick() {
      var diff = target - Date.now();
      if (diff <= 0) { el.innerHTML = '<span class="cd-done">&Egrave; il gran giorno! &#127881;</span>'; clearInterval(timer); return; }
      var d = Math.floor(diff / 86400000);
      var h = Math.floor(diff % 86400000 / 3600000);
      var m = Math.floor(diff % 3600000 / 60000);
      var s = Math.floor(diff % 60000 / 1000);
      el.innerHTML =
        '<span class="cd-unit"><b>' + d + '</b>' + L.g + '</span>' +
        '<span class="cd-unit"><b>' + pad(h) + '</b>' + L.o + '</span>' +
        '<span class="cd-unit"><b>' + pad(m) + '</b>' + L.m + '</span>' +
        '<span class="cd-unit"><b>' + pad(s) + '</b>' + L.s + '</span>';
    }
    tick();
    var timer = setInterval(tick, 1000);
  })();
</script>

<!-- Pulsante "Copia IBAN" nella sezione Regali -->
<script>
  (function () {
    var btn = document.querySelector('[data-iban-copy]');
    var field = document.querySelector('[data-iban]');
    if (!btn || !field) return;

    btn.addEventListener('click', function () {
      // Gli spazi servono solo a rendere leggibile l'IBAN sullo schermo:
      // negli appunti finisce senza.
      var iban = field.textContent.replace(/\s+/g, '');
      var done = function () {
        btn.textContent = 'Copiato \u2713';
        setTimeout(function () { btn.textContent = 'Copia IBAN'; }, 2000);
      };

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(iban).then(done, function () { fallback(iban, done); });
      } else {
        fallback(iban, done);
      }
    });

    // Ripiego per i browser piu' vecchi e per le pagine non in https
    function fallback(text, done) {
      var tmp = document.createElement('textarea');
      tmp.value = text;
      tmp.setAttribute('readonly', '');
      tmp.style.position = 'absolute';
      tmp.style.left = '-9999px';
      document.body.appendChild(tmp);
      tmp.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* niente da fare */ }
      document.body.removeChild(tmp);
    }
  })();
</script>
