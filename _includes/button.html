{% if include.link contains '://' %}
  {% assign _btnlink = include.link %}
{% else %}
  {% assign _btnlink = include.link | default: '#' | relative_url %}
{% endif %}
<a class="button" href="{{ _btnlink }}"{% if include.color %} style="background: {{ include.color }}"{% endif %}>{{ include.text | default: "Button" }}{% if include.icon %}&nbsp; {% include icon.html id=include.icon title=include.icon %}{% endif %}</a>
